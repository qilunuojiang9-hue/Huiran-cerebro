<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B8BF5"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="400" rx="16" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Huiran-cerebro · 赛博大脑</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Personal / Team Memory Brain &amp; Knowledge Base Engine</text>
  <line x1="80" y1="76" x2="820" y2="76" stroke="url(#acc)" stroke-width="2" opacity="0.6"/>

  <!-- 第一层：接入层 -->
  <text x="34" y="104" fill="#4B8BF5" font-size="12" font-weight="600">接入层 · Entry</text>
  <rect x="34" y="114" width="250" height="52" rx="10" fill="#1e3a5f" stroke="#4B8BF5" stroke-width="1.2"/>
  <text x="159" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Web 界面</text>
  <text x="159" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">搜索 / 录入 / 图谱 / 今日看板</text>

  <rect x="325" y="114" width="250" height="52" rx="10" fill="#1e3a5f" stroke="#4B8BF5" stroke-width="1.2"/>
  <text x="450" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">MCP Server</text>
  <text x="450" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">适配豆包等 AI 客户端 · 7 工具</text>

  <rect x="616" y="114" width="250" height="52" rx="10" fill="#1e3a5f" stroke="#4B8BF5" stroke-width="1.2"/>
  <text x="741" y="138" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">CLI / 打卡</text>
  <text x="741" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">cyber_brain.py · session_log.py</text>

  <!-- 箭头 -->
  <path d="M159 166 L159 192 L450 192 L450 202" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M450 166 L450 202" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M741 166 L741 192 L450 192" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- 第二层：核心引擎 -->
  <text x="34" y="228" fill="#7B3FE4" font-size="12" font-weight="600">核心引擎 · Engine</text>
  <rect x="34" y="238" width="832" height="62" rx="10" fill="#2d1b4e" stroke="#7B3FE4" stroke-width="1.2"/>
  <text x="450" y="262" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">CyberBrain Engine</text>
  <text x="450" y="280" text-anchor="middle" fill="#94a3b8" font-size="11">FTS5 trigram 中文全文 · bge-small-zh-v1.5 语义向量 · 记忆碎片 8 类 · 实体关系网 · 滚动摘要 · 自动判重</text>
  <text x="450" y="294" text-anchor="middle" fill="#64748b" font-size="10">recall / search / add_memory / add_content / stats / entity / session_log_tool</text>

  <!-- 箭头 -->
  <path d="M450 300 L450 322" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- 第三层：数据层 -->
  <text x="34" y="346" fill="#10b981" font-size="12" font-weight="600">数据层 · SQLite 单文件（备份 = 拷文件）</text>

  <rect x="34" y="356" width="190" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="129" y="377" text-anchor="middle" fill="#a7f3d0" font-size="11">memory_fragments 记忆碎片</text>

  <rect x="242" y="356" width="190" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="337" y="377" text-anchor="middle" fill="#a7f3d0" font-size="11">kb_document / chunk RAG</text>

  <rect x="450" y="356" width="190" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="545" y="377" text-anchor="middle" fill="#a7f3d0" font-size="11">entity / entity_link 关系网</text>

  <rect x="658" y="356" width="208" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="762" y="377" text-anchor="middle" fill="#a7f3d0" font-size="11">rolling_summaries 滚动摘要</text>
</svg>
